name: Deploy Jobs website to GitHub Pages
# Redeploy the current Jobs application with the new appearance selector and dark theme.

on:
  workflow_dispatch:
  push:
    branches: [release/jobs-android]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jobs-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out actual Jobs application
        uses: actions/checkout@v4
        with:
          ref: release/jobs-android
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - run: npm run build
      - run: npm run release:verify
      - name: Prepare Pages files
        run: |
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/jobs-dashboard-banner.png
          test -f dist/jobs-tasks-banner.png
          test -f dist/jobs-timesheets-banner.png
          test -f dist/jobs-about-banner.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

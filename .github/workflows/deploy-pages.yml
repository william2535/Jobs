name: Deploy Jobs website to GitHub Pages
# Pages environment now allows release/jobs-android; retry deployment.

on:
  workflow_dispatch:
  push:
    branches: [release/jobs-android]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jobs-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out actual Jobs application
        uses: actions/checkout@v4
        with:
          ref: release/jobs-android
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Bundle selected deep-navy Jobs banner for offline use
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/william2535/Jobs/main/2C583FAE-54C0-432C-A7D1-D677F8187546.png' \
            -o public/jobs-dashboard-banner.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/style.css')
          s = p.read_text()
          source = 'https://raw.githubusercontent.com/william2535/Jobs/main/2C583FAE-54C0-432C-A7D1-D677F8187546.png'
          if source not in s:
              raise SystemExit('Selected Jobs banner reference missing')
          p.write_text(s.replace(source, './jobs-dashboard-banner.png'))
          PY
      - run: npm run build
      - run: npm run release:verify
      - name: Prepare Pages files
        run: |
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/jobs-dashboard-banner.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

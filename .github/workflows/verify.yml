name: Verify Jobs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jobs-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run release:verify
      - name: Install PDF verification tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run release:package
      - name: Upload verified release build
        uses: actions/upload-artifact@v4
        with:
          name: jobs-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

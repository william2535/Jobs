  <style>
#jobs-startup{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#020509;color:white;transition:opacity .35s ease,visibility .35s ease;pointer-events:none}
#jobs-startup.is-done{opacity:0;visibility:hidden}
#jobs-startup img{width:min(42vw,190px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 18px #04dfff80);animation:jobsLogoEnter .85s ease both}
#jobs-startup strong{font:900 clamp(30px,8vw,52px) system-ui;animation:jobsLogoEnter .5s ease .7s both}
#jobs-startup small{font:600 10px system-ui;letter-spacing:.22em;color:#c9d9e7;animation:jobsLogoEnter .5s ease 1s both}
#jobs-startup .track{width:min(58vw,240px);height:4px;border-radius:5px;background:#19344b;overflow:hidden}
#jobs-startup .track i{display:block;width:100%;height:100%;background:#20d9ff;transform-origin:left;animation:jobsStartupLoad 1.7s ease .4s both}
@keyframes jobsLogoEnter{from{opacity:0;transform:translateY(12px) scale(.93)}to{opacity:1;transform:none}}
@keyframes jobsStartupLoad{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){#jobs-startup{display:none}}
</style></head>
  <body><div id="jobs-startup" aria-hidden="true"><img src="https://raw.githubusercontent.com/william2535/FIRE-SECURITY-APP-PORTAL/main/assets/jobs-authentic.webp" alt=""><strong>Jobs</strong><small>YOUR WORK. SORTED.</small><span class="track"><i></i></span></div><script>window.addEventListener("DOMContentLoaded",()=>{setTimeout(()=>document.getElementById("jobs-startup")?.classList.add("is-done"),2350)})</script>
    <div id="app"><div role="status"><h1>Jobs</h1><p>Opening your local workspace…</p><p>If Jobs does not open, reconnect and reload. Keep this browser’s website data to preserve your saved work.</p></div></div>
